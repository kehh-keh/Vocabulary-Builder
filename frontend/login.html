<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <h1 class="auth-title">
            Login
        </h1>

        <input
            type="email"
            id="email"
            class="auth-input"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            class="auth-input"
            placeholder="Password"
        >

        <button
            class="auth-btn"
            onclick="login()"
        >
            Login
        </button>

        <p class="link-text">
            No account?
            <a href="signup.html">
                Signup
            </a>
        </p>

    </div>

    <script src="app.js"></script>

</body>
</html>
