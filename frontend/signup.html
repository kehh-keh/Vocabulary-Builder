<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Signup</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <h1 class="auth-title">
            Create Account
        </h1>

        <!-- EMAIL -->
        <input
            type="email"
            id="email"
            class="auth-input"
            placeholder="Email"
        >

        <!-- USERNAME -->
        <input
            type="text"
            id="username"
            class="auth-input"
            placeholder="Username"
        >

        <!-- PASSWORD -->
        <input
            type="password"
            id="password"
            class="auth-input"
            placeholder="Password"
        >


        <button
            class="auth-btn"
            onclick="signup()"
        >
            Sign Up
        </button>

        <p class="link-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

    <script src="app.js"></script>

</body>

</html>
